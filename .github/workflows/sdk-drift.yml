# Does npm still serve what this repo says it does?
#
# This exists because of API-12. A version bump landed without a tag; release.yml
# fires only on `push: tags: ["v*"]`, so it never ran. Nothing was red — the repo
# read 0.4.0, no check failed anywhere, and npm quietly served the pre-fix 0.3.0
# source to every integrator for six days. The fix was recorded as done on the
# strength of the source edit alone.
#
# The gap that allowed it is that *every* existing check runs at push time. A
# release that silently fails to happen produces no push, so it produces no
# signal. This job is the one that runs on a clock instead, and compares the
# repo against the registry — the only source of truth for what users install.
#
# It is deliberately not part of release.yml: that workflow answers "did this
# release work?", which is worthless when the release never fired at all.
name: sdk-drift

on:
  schedule:
    # Mondays 09:00 UTC. Weekly is enough: this catches a release that silently
    # never happened, and the cost of finding that out on Monday rather than in
    # six days' time is what matters.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # scripts/verify-release.sh is the same check release.yml runs before it
      # announces a GitHub Release: resolve dist-tags, download the tarball npm
      # actually serves, diff its src/ against this repo. Running it on a clock
      # closes the "release never fired" hole that release.yml cannot see.
      - name: Compare the published tarball against this repo
        id: verify
        run: scripts/verify-release.sh

      # A drift finding is only useful if a human sees it. A red cron job in the
      # Actions tab is not that — nobody is watching it, which is precisely the
      # failure mode that produced API-12. So file an issue.
      - name: Open an issue when the registry disagrees with the repo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'sdk-drift: npm does not match this repo';
            const { owner, repo } = context.repo;

            // Don't stack a new issue every Monday on an unfixed drift.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sdk-drift', per_page: 10,
            });
            if (existing.data.length > 0) {
              core.info(`Drift issue already open: #${existing.data[0].number}`);
              return;
            }

            const run = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner, repo, title,
              labels: ['sdk-drift'],
              body: [
                '`scripts/verify-release.sh` failed on its weekly run: what npm serves',
                'does not match this repo.',
                '',
                `**Run:** ${run}`,
                '',
                'Two things produce this, and they need different fixes:',
                '',
                '1. **A version bump was committed without a `v*` tag.** `release.yml`',
                '   only fires on a tag push, so it never ran and npm is still serving',
                '   the previous version. Fix: push the tag, or run `release.yml` via',
                '   `workflow_dispatch` with `dry_run: false`. This is the API-12',
                '   failure mode.',
                '2. **The published tarball genuinely differs from source at the same',
                '   version.** That means someone published from a dirty tree. Fix:',
                '   cut a new patch version — a published version is immutable and',
                '   must never be force-overwritten.',
                '',
                'Run `scripts/verify-release.sh` locally for the full diff.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
